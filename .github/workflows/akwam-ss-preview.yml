name: Build and publish Akwam.ss provider
on:
  push:
    branches: [feature/akwam-provider]
    paths:
      - 'Akwam/**'
      - '.github/workflows/akwam-ss-preview.yml'
  workflow_dispatch:
concurrency:
  group: akwam-ss-preview
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Test and build actual Akwam extension
        run: |
          set -e
          for attempt in 1 2 3; do
            if ./gradlew Akwam:testDebugUnitTest Akwam:make --stacktrace; then
              test -s Akwam/build/Akwam.cs3
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Verify package and prepare isolated repository
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,zipfile
          source=pathlib.Path('Akwam/build/Akwam.cs3')
          assert source.is_file() and source.stat().st_size>1500
          with zipfile.ZipFile(source) as z:
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['pluginClassName']=='com.akwam.AkwamPlugin',manifest
              assert manifest['version']==3,manifest
          dest=pathlib.Path('dist/akwam-preview')
          dest.mkdir(parents=True,exist_ok=True)
          artifact=dest/'Akwam-v3.cs3'
          shutil.copyfile(source,artifact)
          data=artifact.read_bytes()
          prefix='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/akwam-preview/'
          plugin={'name':'Akwam.ss (experimental)','internalName':'Akwam',
              'version':3,'fileSize':len(data),
              'fileHash':'sha256-'+hashlib.sha256(data).hexdigest(),
              'apiVersion':1,'repositoryUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY'],
              'url':prefix+artifact.name,'status':3,'language':'ar',
              'authors':['Cinema Plus community'],
              'tvTypes':['Movie','TvSeries','Anime'],
              'description':'Real Akwam.ss watch/download quality routes, episodes, verified MP4; experimental.'}
          repo={'name':'Akwam.ss','manifestVersion':1,
              'description':'Standalone Akwam CloudStream plugin with in-place updates',
              'pluginLists':[prefix+'plugins.json']}
          for name,value in [('plugins.json',[plugin]),('repo.json',repo)]:
              (dest/name).write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')
          print('Akwam v3 package verified',len(data),'bytes')
          PY
      - name: Publish without modifying CineLite
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/akwam-preview
          publish_branch: akwam-preview
          keep_files: true
