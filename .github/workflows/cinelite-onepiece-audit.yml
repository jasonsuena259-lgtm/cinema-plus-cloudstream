name: CineLite One Piece anime navigation audit
on:
  push:
    branches: [feature/cinelite-provider]
    paths:
      - 'tests/probe_cinelite_one_piece_episode.cjs'
      - '.github/workflows/cinelite-onepiece-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/cinelite
          cd /tmp/cinelite
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probe ONE PIECE anime episode navigation
        env:
          NODE_PATH: /tmp/cinelite/node_modules
        run: node tests/probe_cinelite_one_piece_episode.cjs
