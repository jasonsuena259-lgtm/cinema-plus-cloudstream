name: Probe Dexter fallback metadata
on:
  push:
    branches: [feature/dexter-provider]
    paths: ['tests/probe_dexter_metadata.py', '.github/workflows/dexter-metadata-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tests/probe_dexter_metadata.py
