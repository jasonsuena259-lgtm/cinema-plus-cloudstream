name: Build and publish independent providers
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Check Android-compatible regex syntax with ICU
        run: python3 tests/check_icu_regex.py
      - name: Build and test
        run: ./gradlew CinemaPlus:testDebugUnitTest Akwam:testDebugUnitTest CinemaPlus:make Akwam:make TukTukCinema:testDebugUnitTest TukTukCinema:make CineWave:testDebugUnitTest CineWave:make MySeed:testDebugUnitTest MySeed:make CineLite:testDebugUnitTest CineLite:make makePluginsJson
      - name: Prepare independent repository metadata
        env:
          PUBLISH_BRANCH: builds
        run: |
          mkdir -p dist
          python3 tests/package_release.py
          python3 -c 'import json,os; r=os.environ["GITHUB_REPOSITORY"]; json.dump({"name":"Cinema Plus and Akwam","manifestVersion":1,"pluginLists":[f"https://raw.githubusercontent.com/{r}/builds/plugins.json"]},open("dist/repo.json","w"),indent=2)'
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-plus
          path: dist/
          if-no-files-found: error
      - name: Publish builds branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: builds
