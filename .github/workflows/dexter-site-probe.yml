name: Probe Dexter.pw public HTML
on:
  push:
    branches: [feature/dexter-provider]
    paths:
      - 'tests/probe_dexter.py'
      - '.github/workflows/dexter-site-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect genuine catalogue and player DOM without downloading media
        run: python tests/probe_dexter.py
