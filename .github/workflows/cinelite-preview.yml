name: Publish CineLite experimental repository
on:
  push:
    branches: [feature/cinelite-provider]
    paths:
      - 'CineLite/**'
      - 'build.gradle.kts'
      - '.github/workflows/cinelite-preview.yml'
  workflow_dispatch:
concurrency:
  group: cinelite-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Compile CineLite and run all unit tests
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Compiling CineLite (attempt $attempt)"
            if ./gradlew CineLite:testDebugUnitTest CineLite:make; then
              test -s CineLite/build/CineLite.cs3
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Assemble standalone experimental repository
        env:
          PUBLISH_BRANCH: cinelite-preview
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, zipfile
          base=pathlib.Path('.')
          package=base/'CineLite/build/CineLite.cs3'
          assert package.is_file(), "No CineLite.cs3 built"
          with zipfile.ZipFile(package) as archive:
              manifest=json.loads(archive.read('manifest.json'))
              assert manifest['pluginClassName']=='com.cinelite.CineLitePlugin', manifest
              assert manifest['version']==18, manifest
          dest=base/'dist/cinelite-preview'
          dest.mkdir(parents=True,exist_ok=True)
          artifact=dest/'CineLite-v18.cs3'
          shutil.copyfile(package,artifact)
          data=artifact.read_bytes()
          prefix='https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/cinelite-preview/'
          plugin={
              'fileHash':'sha256-'+hashlib.sha256(data).hexdigest(),
              'apiVersion':1,
              'repositoryUrl':'https://github.com/'+os.environ['GITHUB_REPOSITORY'],
              'fileSize':len(data),
              'status':3,'language':'en','authors':['Cinema Plus community'],
              'tvTypes':['Movie','TvSeries','Anime'],
              'version':18,'internalName':'CineLite',
              'description':'EXPERIMENTAL v18: longer real source capture and subtitle URL support; individual media streams remain unverified.',
              'url':prefix+artifact.name, 'name':'CineLite (experimental)'
          }
          def write_json(path, value):
              path.write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n')

          # CloudStream/KodaStream associates an installed extension with the
          # original repository URL and internalName. Do NOT force users to
          # remove/re-add the repo when a new .cs3 version is published.
          #
          # Previous repo-vN.json files pointed to plugins-vN.json, which kept
          # advertising N forever (after newer releases). Publish every
          # historical alias with the CURRENT metadata so Update all can
          # upgrade an existing CineLite installation in place. Old .cs3
          # packages remain on the publish branch for old cached downloads.
          write_json(dest/'plugins.json', [plugin])
          write_json(dest/'repo.json', {
              'name':'CineLite Experimental',
              'description':'CineLite updates from your existing repository',
              'manifestVersion':1,
              'pluginLists':[prefix+'plugins.json']
          })
          for installed_version in range(7,plugin['version']+1):
              plugin_list=f'plugins-v{installed_version}.json'
              repository=f'repo-v{installed_version}.json'
              write_json(dest/plugin_list, [plugin])
              write_json(dest/repository, {
                  'name':f'CineLite v{installed_version} - automatic updates',
                  'description':f'Keep this repository for CineLite v{plugin["version"]} and future updates',
                  'manifestVersion':1,
                  'pluginLists':[prefix+plugin_list]
              })
              # Simulate KodaStream's parseRepository -> parsePlugins ->
              # updateAll matching logic for every old installed version.
              loaded_repo=json.loads((dest/repository).read_text())
              loaded_plugin=json.loads((dest/plugin_list).read_text())[0]
              assert loaded_repo['pluginLists']==[prefix+plugin_list]
              assert loaded_plugin['internalName']=='CineLite'
              assert loaded_plugin['version']>installed_version or installed_version==plugin['version']
              assert loaded_plugin['fileSize']==artifact.stat().st_size
              assert loaded_plugin['url']==prefix+artifact.name
              assert loaded_plugin['fileHash']==plugin['fileHash']
          print('Preview repository created with verified .cs3 hash and size')
          PY
      - name: Preserve historical packages for stale CloudStream caches
        run: |
          set -e
          # CloudStream can retain an older plugins.json for a while. Keep
          # matching versioned packages online instead of returning 404.
          git fetch --no-tags --depth=20 origin cinelite-preview || true
          for item in \
            'b97518640f2e598bea928de8c82c6d67e33a9e1a:CineLite-v8.cs3' \
            '169d108f1a6627d1889df2b13811616cd4f36b66:CineLite-v7.cs3'; do
            revision="${item%%:*}"
            filename="${item#*:}"
            if git cat-file -e "${revision}:${filename}" 2>/dev/null; then
              git show "${revision}:${filename}" > "dist/cinelite-preview/${filename}"
              echo "Kept historical artifact: ${filename}"
            else
              echo "No historical artifact available for ${filename}"
            fi
          done
      - name: Publish isolated CineLite preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/cinelite-preview
          publish_branch: cinelite-preview
          keep_files: true
