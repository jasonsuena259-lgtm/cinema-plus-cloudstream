name: KodaStream Android emulator CineLite smoke test
on:
  push:
    branches: [feature/cinelite-provider]
    paths:
      - 'tests/android_cinelite_smoke.py'
      - 'tests/android_cinelite_catalog_probe.py'
      - '.github/workflows/cinelite-android-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify published v16 repo and package
        env:
          RELEASE_REPO: https://raw.githubusercontent.com/jasonsuena259-lgtm/cinema-plus-cloudstream/cinelite-preview
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base=os.environ['RELEASE_REPO']
          def read(name):
              with urllib.request.urlopen(base+'/'+name,timeout=20) as res:
                  return res.read()
          import time
          for attempt in range(20):
              try:
                  repo=json.loads(read('repo-v16.json'))
                  entry=json.loads(read('plugins-v16.json'))[0]
                  assert entry['version']==16,entry.get('version')
                  assert entry['url'].endswith('/CineLite-v16.cs3'),entry['url']
                  assert repo['pluginLists']==[base+'/plugins-v16.json']
                  with urllib.request.urlopen(entry['url'],timeout=25) as stream:
                      assert stream.status==200
                      assert stream.headers.get('Content-Type') is not None
                  print('Verified published v16 APK-compatible CloudStream package metadata')
                  break
              except Exception as exc:
                  if attempt==19: raise RuntimeError('v16 binary not published or invalid') from exc
                  print('Versioned package not yet published; retry',attempt+1)
                  time.sleep(15)
          PY
      - name: Download public KodaStream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download v0.8.0 -R mo7AmMeD64/cloudSTREAM3 -p "cloud3-105.apk" -D /tmp
          test -s /tmp/cloud3-105.apk
      - name: Enable KVM hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo 'No /dev/kvm; emulator may be too slow' >&2
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          emulator-boot-timeout: 700
          disable-animations: true
          script: |
            adb shell dumpsys webviewupdate | head -n 25
            adb install -r /tmp/cloud3-105.apk
            adb shell wm size 720x1280
            adb shell wm density 320
            CINELITE_REPO=https://raw.githubusercontent.com/jasonsuena259-lgtm/cinema-plus-cloudstream/cinelite-preview/repo-v16.json CINELITE_VERSION=16 python3 tests/android_cinelite_smoke.py
            python3 tests/android_cinelite_catalog_probe.py
      - name: Upload screenshots and UI semantics (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodastream-android-emulator-cinelite
          path: artifacts/android-cinelite
          if-no-files-found: warn
          retention-days: 5
