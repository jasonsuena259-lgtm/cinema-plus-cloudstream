name: Build and publish Cinema Plus
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check Android-compatible regex syntax with ICU
        run: python3 tests/check_icu_regex.py
      - name: Build and test
        run: ./gradlew CinemaPlus:testDebugUnitTest CinemaPlus:make makePluginsJson
      - name: Prepare repository metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp CinemaPlus/build/*.cs3 build/plugins.json dist/
          python3 -c 'import json,os; r=os.environ["REPOSITORY"]; json.dump({"name":"Cinema Plus","description":"Cinema Plus CloudStream provider","manifestVersion":1,"pluginLists":[f"https://raw.githubusercontent.com/{r}/builds/plugins.json"]},open("dist/repo.json","w"),ensure_ascii=False,indent=2)'
      - uses: actions/upload-artifact@v4
        with:
          name: cinema-plus
          path: dist/
          if-no-files-found: error
      - name: Publish builds branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: builds
