name: Inspect real Akwam.ss HTML structure safely
on:
  workflow_dispatch:
  push:
    branches: [feature/akwam-provider]
    paths: ['.github/workflows/akwam-ss-site-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect genuine HTML for cards, seasons, players and downloads
        run: |
          python - <<'PY'
          import requests,bs4,re,urllib.parse,json
          origin="https://akwam.ss"
          checks=[
             ("movies","/movies"),
             ("series","/series"),
             ("movie-detail","/movie/11572/love-language"),
             ("series-detail","/series/5908/the-diplomat-%D8%A7%D9%84%D9%85%D9%88%D8%B3%D9%85-%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9"),
             ("episode-detail","/episode/104382/the-diplomat/episode-1"),
             ("watch","/watch/183443/11572/love-language"),
             ("download","/download/183443/11572/love-language"),
             ("search","/search?q=Love%20Language")
          ]
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0 (Android 13; Mobile) AppleWebKit/537.36 Chrome/122 Safari/537.36"
          for name,path in checks:
            try:
              r=s.get(origin+path,timeout=16,allow_redirects=True)
              soup=bs4.BeautifulSoup(r.text,"html.parser")
              counters={}
              for fragment in ["/movie/","/series/","/episode/","/watch/","/download/"]:
                counters[fragment]=len(soup.select('a[href*="'+fragment+'"]'))
              poster_classes=[x.get("class") for x in soup.select("a[href]") if
                any(f in x.get("href","") for f in ["/movie/","/series/"])][:5]
              has_episodes=bool(soup.select("a[href*='/episode/']"))
              # Avoid recording signed player links or download tokens in logs.
              print("AKWAM_SITE_REPORT",json.dumps({
                "area":name,"http":r.status_code,
                "pageTitle":(soup.title.text or "")[:75] if soup.title else "",
                "h1":[x.text.strip()[:70] for x in soup.select("h1")[:2]],
                "linkCounts":counters,
                "movieSeriesCardClassSamples":poster_classes,
                "episodeListPresent":has_episodes,
                "videoElements":len(soup.select("video,iframe")),
                "downloadHostCount":len([a for a in soup.select("a[href]") if
                    "downet.net" in a.get("href","")])
              },ensure_ascii=False))
            except Exception as e:
              print("AKWAM_SITE_REPORT",json.dumps({"area":name,"error":type(e).__name__}))
          PY
