name: Inspect real Akwam.ss HTML structure safely
on:
  workflow_dispatch:
  push:
    branches: [feature/akwam-provider]
    paths: ['.github/workflows/akwam-ss-site-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect genuine HTML for cards, seasons, players and downloads
        run: |
          python - <<'PY'
          import requests,bs4,re,urllib.parse,json
          origin="https://akwam.ss"
          checks=[
             ("movies","/movies"),
             ("series","/series"),
             ("movie-detail","/movie/11572/love-language"),
             ("series-detail","/series/5908/the-diplomat-%D8%A7%D9%84%D9%85%D9%88%D8%B3%D9%85-%D8%A7%D9%84%D8%B1%D8%A7%D8%A8%D8%B9"),
             ("episode-detail","/episode/104382/the-diplomat/episode-1"),
             ("watch","/watch/183443/11572/love-language"),
             ("download","/download/183443/11572/love-language"),
             ("search","/search?q=Love%20Language")
          ]
          s=requests.Session()
          s.headers["User-Agent"]="Mozilla/5.0 (Android 13; Mobile) AppleWebKit/537.36 Chrome/122 Safari/537.36"
          for name,path in checks:
            try:
              r=s.get(origin+path,timeout=16,allow_redirects=True)
              soup=bs4.BeautifulSoup(r.text,"html.parser")
              counters={}
              for fragment in ["/movie/","/series/","/episode/","/watch/","/download/"]:
                counters[fragment]=len(soup.select('a[href*="'+fragment+'"]'))
              poster_classes=[x.get("class") for x in soup.select("a[href]") if
                any(f in x.get("href","") for f in ["/movie/","/series/"])][:5]
              if name in ("movies","series","series-detail","watch","download"):
                candidates=soup.select("a[href*='/movie/'],a[href*='/series/'],a[href*='/episode/']")
                samples=[{
                  "tag":a.name,"classes":a.get("class",[]),
                  "textLen":len(a.get_text(" ",strip=True)),
                  "childTags":[el.name for el in a.find_all(recursive=False)[:5]],
                  "hasImage":bool(a.select_one("img")),
                  "hasHeading":bool(a.select_one("h2,h3,h4")),
                  "parentClass":a.parent.get("class",[]) if a.parent else []
                } for a in candidates[:7]]
                print("AKWAM_CARD_MARKUP",json.dumps({"area":name,"samples":samples}))
              if name=="watch":
                media=soup.select("video,iframe")
                print("AKWAM_WATCH_MARKUP",json.dumps({
                  "elements":[{"tag":el.name,"attrKeys":list(el.attrs.keys()),
                    "childTags":[c.name for c in el.find_all(recursive=False)[:6]]} for el in media[:5]],
                  "playerScriptCount":len(soup.select("script[src]")),
                  "sources":[{"type":el.get("type"),
                    "hasSrc":bool(el.get("src")),"srcExtension":
                      (urllib.parse.urlparse(el.get("src","")).path.rsplit(".",1)[-1][:8]
                        if "." in urllib.parse.urlparse(el.get("src","")).path else None),
                    "host":urllib.parse.urlparse(el.get("src","")).hostname} for el in soup.select("video source")[:6]]
                }))
              if name in ("watch","download"):
                media_links=([
                  el.get("src") for el in soup.select("video source[src]")
                ] if name=="watch" else [
                  a.get("href") for a in soup.select("a[href*='downet.net']")
                ])
                outcomes=[]
                for raw in list(dict.fromkeys(filter(None,media_links)))[:3]:
                  try:
                    link=urllib.parse.urljoin(r.url,raw)
                    with s.get(link,headers={"Range":"bytes=0-2047"},stream=True,timeout=10) as mp4:
                      fragment=next(mp4.iter_content(chunk_size=32),b"")
                      outcomes.append({"http":mp4.status_code,
                        "type":mp4.headers.get("Content-Type","").split(";")[0][:45],
                        "isMp4":len(fragment)>8 and fragment[4:8] in (b"ftyp",b"styp",b"moof")})
                  except Exception as ex:
                    outcomes.append({"error":type(ex).__name__})
                print("AKWAM_MP4_RANGE_TEST",json.dumps({"area":name,"results":outcomes}))
              has_episodes=bool(soup.select("a[href*='/episode/']"))
              # Avoid recording signed player links or download tokens in logs.
              print("AKWAM_SITE_REPORT",json.dumps({
                "area":name,"http":r.status_code,
                "pageTitle":(soup.title.text or "")[:75] if soup.title else "",
                "h1":[x.text.strip()[:70] for x in soup.select("h1")[:2]],
                "linkCounts":counters,
                "movieSeriesCardClassSamples":poster_classes,
                "episodeListPresent":has_episodes,
                "videoElements":len(soup.select("video,iframe")),
                "downloadHostCount":len([a for a in soup.select("a[href]") if
                    "downet.net" in a.get("href","")])
              },ensure_ascii=False))
            except Exception as e:
              print("AKWAM_SITE_REPORT",json.dumps({"area":name,"error":type(e).__name__}))
          PY
